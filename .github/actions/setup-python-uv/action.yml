name: Set up Python and uv
description: >
  Installs the Python version the project targets, plus uv. Shared by the
  Python workflows so the version and the pinned action SHA live in one place.

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.14"

    - name: Install uv
      shell: bash
      run: python -m pip install --upgrade pip uv
