name: Set up Python and uv
description: >
  Installs a Python version the project supports, plus uv. Shared by the
  Python workflows so the default version and the pinned action SHA live in
  one place.

inputs:
  python-version:
    description: >
      Which Python to install. The default is the newest supported version,
      the one the container image ships; jobs that also cover the floor of
      requires-python in pyproject.toml pass that one instead.
    required: false
    default: "3.14"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv
      # Pinned twice on purpose: the action by SHA, like every action here,
      # and uv itself, which upstream calls best practice. uv is what enforces
      # --locked on everything else, and unpinned it is the one dependency
      # that can turn a green run red without a change in this repository -
      # uv.lock carries a format revision, and the version that reads it came
      # from whatever PyPI served that morning.
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: "0.12.2"
