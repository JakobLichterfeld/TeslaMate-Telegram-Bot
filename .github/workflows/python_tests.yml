name: Python tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Both interpreters the project ships on: 3.14 in the container image,
        # 3.13 in the Nix package, because that is what nixpkgs 26.05 defaults
        # to - and both ends of requires-python in pyproject.toml.
        python-version: ["3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run pytest
        # The version comes from uv.lock, which is generated from
        # pyproject.toml and is the single place any version is pinned - the
        # devenv shell runs the suite through the very same file. --locked
        # fails instead of silently relocking, and --cov-fail-under backs the
        # coverage badge in the README: the number cannot drop without CI
        # going red.
        run: uv run --locked --group test pytest --cov-fail-under=100
